server {
    listen 80;
    server_name unihire.online;

    # Nếu dùng ALB/Cloudflare, x-forwarded-proto sẽ là https
    # Chuyển hướng tất cả từ non-www sang www
    return 301 https://www.unihire.online$request_uri;
}

server {
    listen 80;
    server_name www.unihire.online localhost;
    
    # Phục vụ file tĩnh của Frontend (React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp các request API tới Backend (đang chạy ở cổng 8080)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Nếu Frontend của bạn gửi request trực tiếp đến /auth/login
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /home/payment/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}